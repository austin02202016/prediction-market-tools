name: Validate and build README
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate tools.json
        run: python3 scripts/validate.py
      - name: README is generated from tools.json
        run: |
          python3 scripts/build_readme.py
          if ! git diff --quiet README.md; then
            echo "README.md is out of date. Run: python3 scripts/build_readme.py"
            git diff --stat
            exit 1
          fi
